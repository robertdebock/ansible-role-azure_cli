---
# Internal variables for azure_cli

# Map OS family to required packages for Azure CLI to run.
_azure_cli_required_packages:
  default:
    - python3-setuptools
  Alpine:
    - py3-setuptools
    - py3-pip

azure_cli_required_packages: "{{ _azure_cli_required_packages[ansible_facts['os_family']] | default(_azure_cli_required_packages['default']) }}"

# Map distribution release names to the codename supported by the Azure CLI APT repo.
# Microsoft does not publish for Debian testing/unstable (e.g. trixie, sid);
# map those to the latest supported stable release.
_azure_cli_apt_codename_map:
  default: {}
  Debian:
    trixie: bookworm
    sid: bookworm

azure_cli_apt_codename: "{{ _azure_cli_apt_codename_map[ansible_facts['os_family']][ansible_facts['distribution_release']] | default(ansible_facts['distribution_release']) }}"

# Microsoft only publishes an old EL 7 rpm for Fedora (rejected by current rpm, no digest), use pip there. Distributions
# without a supported package manager use pip as well.
azure_cli_install_with_pip: "{{ ansible_facts['distribution'] == 'Fedora' or ansible_facts['pkg_mgr'] not in [ 'apt', 'yum', 'dnf', 'zypper', 'dnf5' ] }}"
